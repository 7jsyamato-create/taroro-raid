<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TARORO RAID PARTY BUILDER</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:#f4f6fb;color:#252b3b}

</style></head><body>
<div class="status" id="status">PCはドラッグ、スマホは名前をタップ → 移動先をタップ。新しい人は右の「メンバー追加」から登録できます。</div>
<header><div><h1>⚔ TARORO RAID PARTY BUILDER</h1><div class="sub">Discord共有版 v3 ・ PT2登録済み ・ メンバー追加対応</div></div><div class="buttons"><button id="sort1">PT1 職業順</button><button id="sort2">PT2 職業順</button><button id="sortall">両PT 職業順</button><button id="img1">📷 PT1画像</button><button id="img2">📷 PT2画像</button><button id="reset">初期状態</button><button id="clear2">PT2クリア</button><button id="share" class="discord">Discordで共有</button></div></header>

</main><aside class="panel pool"><div class="ph" style="display:block">メンバー一覧<input id="search" class="search" placeholder="名前を検索"></div>
<div class="addbox"><b>＋ メンバー追加</b><div class="help">追加した名前も共有URLに含まれます。</div><div class="addrow"><input id="newname" class="addinput" placeholder="新しい名前"><button id="add">追加</button></div></div><div id="pool" class="poolbody"></div></aside></div>
<div id="modal" class="modal"><div class="box"><h2>Discordで共有</h2><p class="help">現在のPT・職業・型・追加メンバーをURLにまとめます。</p><div id="sharetext" class="sharetext"></div><textarea id="url" readonly></textarea><div class="buttons" style="margin-top:10px"><button id="copytext" class="discord">Discord用文章をコピー</button><button id="copyurl">URLだけコピー</button><button id="nativeShare">共有メニュー</button><button id="close">閉じる</button></div></div></div><div id="toast" class="toast"></div>
<script>
const D={"names":["TARO","よしの","アヤカ","セシリア","kaine","マチュ","ぴゃ","ゆきしっぽ","Riki","ひなぴ","Kainagi","カズキ","えりゅ","シュマ","そまり","SHIIIIKU","セウ","鶴陽","藤瞬垂天","せるか","たかちゃん","BiBi","ダイジョブ博士","Masa17","aru","aska","NullSmith","あらーちゃん","Nira","ゆず大福","風星","Kopi","こころ","黒猫","ロドリンゴ2","量産型193","マシーン","sybila","kurosyo","はっせー","HIRO","CHIKA","roro","AlterEgo","afkx","むすこ","micon","herohero","またむん","x倉庫","Rim","meirum","ぽこらしあ","Sui","アメリタット","ももも","しののめ","kyabetsu","アカシオ","Ayaka","lmitation","Montis","すみのちゃん","マリアベル","ぐちこ","むうちゃ","ますこ","MieRcooke","ももぴい","あくぴっぴ","kuruminal","ねこず","兼元灯里","かろり","ころみん","Aria","ふるぽん","night","やち","seg","フリージア","よんひ","コレット（アヤカ）","エスカ（アヤカ）","マシロ（アヤカ）","フェスティ（アヤカ）","ひよぴ（ひなぴ）","たろうだよ（TARO）","ももたろう（TARO）","DrNoproblem（ダイジョブ博士）","ネコロガール（たかちゃん）","タチアガール（たかちゃん）","01（セウ）","よしりー（よしの）","ヨシノ（よしの）","Ka（kaine）"],"pt1":[["よしの","タンク","光盾"],["Montis","タンク","剛守"],["せるか","ヒーラー",""],["風星","ヒーラー",""],["ひなぴ","DPS","氷牙"],["kurosyo","DPS","月影"],["lmitation","DPS","月影"],["TARO","DPS","乱風"],["アヤカ","DPS","鷹弓"],["あらーちゃん","DPS","双炎"],["藤瞬垂天","タンク","光盾"],["カズキ","タンク","光盾"],["kaine","ヒーラー","響奏"],["Riki","ヒーラー","響奏"],["kyabetsu","DPS","鷹弓"],["ももぴい","DPS","鷹弓"],["BiBi","DPS","狼弓"],["ももも","DPS","双炎"],["たかちゃん","DPS","狼弓"],["シュマ","DPS","鷹弓"]],"pt2":[["アメリタット","タンク","剛守"],["マチュ","タンク","剛守"],["セシリア","タンク","剛守"],["SHIIIIKU","タンク","剛身"],["あくぴっぴ","ヒーラー","森癒"],["こころ","ヒーラー","森癒"],["量産型193","ヒーラー","威咲"],["Masa17","ヒーラー","威咲"],["そまり","DPS","双炎"],["ゆず大福","DPS","鷹弓"],["ぴゃ","DPS","月影"],["セウ","DPS","乱風"],["すみのちゃん","DPS","雷刃"],["aru","DPS","月影"],["鶴陽","DPS","鷹弓"],["Nira","DPS","月影"],["Sui","DPS","乱風"],["aska","DPS","雷刃"],["kuruminal","DPS","乱風"]]},roles=["","タンク","ヒーラー","DPS"],types=["","光盾","剛守","剛身","威咲","森癒","響奏","氷牙","月影","乱風","鷹弓","双炎","狼弓","雷刃"];
const tr={"光盾":"タンク","剛守":"タンク","剛身":"タンク","威咲":"ヒーラー","森癒":"ヒーラー","響奏":"ヒーラー","氷牙":"DPS","月影":"DPS","乱風":"DPS","鷹弓":"DPS","双炎":"DPS","狼弓":"DPS","雷刃":"DPS"};
let names=[...D.names],mem={};names.forEach(n=>mem[n]={role:"",type:""});[...D.pt1,...D.pt2].forEach(([n,r,t])=>{if(!names.includes(n))names.push(n);mem[n]={role:r,type:t}});
const init={pt1:D.pt1.map(x=>x[0]),pt2:[...D.pt2.map(x=>x[0]),null]};let st={pt1:[...init.pt1],pt2:[...init.pt2]},sel=null;
const $=id=>document.getElementById(id);function toast(s){$("toast").textContent=s;$("toast").classList.add("on");setTimeout(()=>$("toast").classList.remove("on"),1300)}
function encode(o){let s=JSON.stringify(o),bytes=new TextEncoder().encode(s),bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function decode(s){try{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";let bin=atob(s),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}catch(e){return null}}
function load(){if(location.hash.length>1){let x=decode(location.hash.slice(1));if(x&&x.pt1&&x.pt2){if(Array.isArray(x.names)){names=x.names;names.forEach(n=>{if(!mem[n])mem[n]={role:"",type:""}})}st.pt1=x.pt1;st.pt2=x.pt2;if(x.mem)Object.keys(x.mem).forEach(n=>mem[n]=x.mem[n])}}}
function snap(){return{pt1:st.pt1,pt2:st.pt2,names,mem}}function find(n){for(const t of["pt1","pt2"]){let i=st[t].indexOf(n);if(i>=0)return{t,i}}return null}
function move(n,t,i){let f=find(n),target=st[t][i];if(f&&f.t===t&&f.i===i){sel=null;render();return}if(f)st[f.t][f.i]=target||null;st[t][i]=n;sel=null;$("status").textContent=target?`${n} と ${target} を交換しました`:`${n} を移動しました`;render()}
function opts(a,v){return a.map(x=>`<option value="${x}" ${x===v?"selected":""}>${x||"—"}</option>`).join("")}function cls(m){let r=m.role||tr[m.type]||"";return r==="タンク"?"tank":r==="ヒーラー"?"heal":r==="DPS"?"dps":"none"}
function card(n){let m=mem[n]||{role:"",type:""};mem[n]=m;let d=document.createElement("div");d.className=`card ${cls(m)} ${sel===n?"selected":""}`;d.draggable=true;let b=document.createElement("button");b.className="nm";b.textContent=n;b.onclick=e=>{e.stopPropagation();sel=sel===n?null:n;$("status").textContent=sel?`${n} を選択中。移動先をタップしてください。`:"選択解除";render()};let r=document.createElement("select");r.innerHTML=opts(roles,m.role);r.onchange=e=>{m.role=e.target.value;render()};let t=document.createElement("select");t.innerHTML=opts(types,m.type);t.onchange=e=>{m.type=e.target.value;if(!m.role&&tr[m.type])m.role=tr[m.type];render()};d.append(b,r,t);d.ondragstart=e=>e.dataTransfer.setData("text/plain",n);return d}
function team(t){let b=$(t);b.innerHTML="";st[t].forEach((n,i)=>{let s=document.createElement("div");s.className="slot";let no=document.createElement("div");no.className="no";no.textContent=i+1;s.append(no);if(n)s.append(card(n));s.ondragover=e=>{e.preventDefault();s.classList.add("target")};s.ondragleave=()=>s.classList.remove("target");s.ondrop=e=>{e.preventDefault();s.classList.remove("target");let n=e.dataTransfer.getData("text/plain");if(n)move(n,t,i)};s.onclick=e=>{if(sel&&!e.target.closest(".card"))move(sel,t,i)};b.append(s)});$("count"+(t==="pt1"?"1":"2")).textContent=st[t].filter(Boolean).length+"/20"}
function pool(){let b=$("pool"),q=$("search").value.trim().toLowerCase(),used=new Set([...st.pt1,...st.pt2].filter(Boolean));b.innerHTML="";names.filter(n=>n.toLowerCase().includes(q)).forEach(n=>{let x=document.createElement("button");x.className="person "+(used.has(n)?"used":"");x.textContent=n;x.draggable=true;x.ondragstart=e=>e.dataTransfer.setData("text/plain",n);x.onclick=()=>{sel=n;$("status").textContent=`${n} を選択中。PTの移動先をタップしてください。`;render()};b.append(x)})}
function render(){team("pt1");team("pt2");pool()}
$("add").onclick=()=>{let n=$("newname").value.trim();if(!n)return toast("名前を入力してね");if(names.includes(n))return toast("その名前は登録済みです");names.push(n);mem[n]={role:"",type:""};$("newname").value="";$("search").value="";render();toast(`${n} を追加しました`)};
$("newname").addEventListener("keydown",e=>{if(e.key==="Enter")$("add").click()});$("search").oninput=pool;
$("reset").onclick=()=>{st={pt1:[...init.pt1],pt2:[...init.pt2]};sel=null;history.replaceState(null,"",location.href.split("#")[0]);render()};$("clear2").onclick=()=>{st.pt2=Array(20).fill(null);render()};
function roleOf(n){let m=mem[n]||{role:"",type:""};return m.role||tr[m.type]||""}
function sortTeam(t){const order={"タンク":0,"ヒーラー":1,"DPS":2,"":3};const filled=st[t].filter(Boolean).map((n,i)=>({n,i,r:order[roleOf(n)]??3}));filled.sort((a,b)=>a.r-b.r||a.i-b.i);st[t]=filled.map(x=>x.n);while(st[t].length<20)st[t].push(null);sel=null;render();$("status").textContent=(t==="pt1"?"PT1":"PT2")+"を タンク → ヒーラー → DPS の順に並べました。"}
$("sort1").onclick=()=>sortTeam("pt1");$("sort2").onclick=()=>sortTeam("pt2");$("sortall").onclick=()=>{sortTeam("pt1");sortTeam("pt2");$("status").textContent="両PTを タンク → ヒーラー → DPS の順に並べました。"};
function exportTeamImage(t){const list=st[t].filter(Boolean),W=1080,rowH=74,pad=54,head=150,H=head+Math.max(1,list.length)*rowH+pad;let cv=document.createElement("canvas");cv.width=W;cv.height=H;let x=cv.getContext("2d");x.fillStyle="#f4f6fb";x.fillRect(0,0,W,H);x.fillStyle="#252b3b";x.font="700 46px system-ui,sans-serif";x.fillText("TARORO RAID PARTY "+(t==="pt1"?"1":"2"),pad,72);x.font="600 23px system-ui,sans-serif";x.fillStyle="#778096";x.fillText(list.length+"/20 MEMBERS",pad,112);list.forEach((n,i)=>{let m=mem[n]||{},r=roleOf(n),y=head+i*rowH;x.fillStyle=r==="タンク"?"#dceeff":r==="ヒーラー"?"#e0f5e7":r==="DPS"?"#fae0e7":"#eef1f5";x.beginPath();x.roundRect(pad,y,W-pad*2,rowH-10,14);x.fill();x.fillStyle="#8b93a3";x.font="700 18px system-ui,sans-serif";x.fillText(String(i+1).padStart(2,"0"),pad+18,y+40);x.fillStyle="#252b3b";x.font="700 27px system-ui,'Noto Sans JP',sans-serif";x.fillText(n,pad+72,y+40);x.textAlign="right";x.font="700 20px system-ui,'Noto Sans JP',sans-serif";x.fillText((r||"—")+"  "+(m.type||"—"),W-pad-20,y+39);x.textAlign="left"});let a=document.createElement("a");a.download="TARORO_"+(t==="pt1"?"PT1":"PT2")+".png";a.href=cv.toDataURL("image/png");a.click();toast((t==="pt1"?"PT1":"PT2")+"の画像を作りました")}
$("img1").onclick=()=>exportTeamImage("pt1");$("img2").onclick=()=>exportTeamImage("pt2");
const SB_URL="https://rdulolnmrlyynjyabzgw.supabase.co",SB_KEY="sb_publishable_z-Ksxei4TX5UXpfHzUu_4g_oh-7-Yao";
function shortId(){const a=new Uint8Array(6);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(36).padStart(2,"0")).join("").slice(0,8)}
async function saveShare(){for(let tries=0;tries<4;tries++){let id=shortId();let res=await fetch(SB_URL+"/rest/v1/party_shares",{method:"POST",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({id,data:snap()})});if(res.ok)return id;if(res.status!==409)throw new Error(await res.text())}throw new Error("ID collision")}
async function shareData(){try{$("share").disabled=true;$("share").textContent="保存中…";let id=await saveShare(),base=location.href.split("?")[0].split("#")[0],url=base+"?p="+id,c1=st.pt1.filter(Boolean).length,c2=st.pt2.filter(Boolean).length,text=`⚔️ TARORO レイド編成\nPT1：${c1}/20　PT2：${c2}/20\n編成を見る・編集する👇\n${url}`;$("url").value=url;$("sharetext").textContent=`⚔️ TARORO レイド編成\nPT1：${c1}/20　PT2：${c2}/20\n短い共有URLを作成しました。`;$("modal").classList.add("show");return{text,url}}catch(e){toast("共有URLの作成に失敗しました");console.error(e);return null}finally{$("share").disabled=false;$("share").textContent="Discordで共有"}}
async function loadShort(){let id=new URLSearchParams(location.search).get("p");if(!id)return false;try{let res=await fetch(SB_URL+"/rest/v1/party_shares?id=eq."+encodeURIComponent(id)+"&select=data",{headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY}});if(!res.ok)return false;let rows=await res.json();if(!rows.length)return false;let x=rows[0].data;if(Array.isArray(x.names)){names=x.names;names.forEach(n=>{if(!mem[n])mem[n]={role:"",type:""}})}if(x.pt1&&x.pt2){st.pt1=x.pt1;st.pt2=x.pt2}if(x.mem)Object.keys(x.mem).forEach(n=>mem[n]=x.mem[n]);return true}catch(e){console.error(e);return false}}
async function copy(s){try{await navigator.clipboard.writeText(s);toast("コピーしました")}catch(e){let ta=document.createElement("textarea");ta.value=s;document.body.append(ta);ta.select();document.execCommand("copy");ta.remove();toast("コピーしました")}}
$("share").onclick=shareData;$("close").onclick=()=>$("modal").classList.remove("show");$("copyurl").onclick=()=>copy($("url").value);$("copytext").onclick=()=>copy($("sharetext").textContent);$("nativeShare").onclick=async()=>{let d=await shareData();if(!d)return;if(navigator.share){try{await navigator.share({title:"TARORO レイド編成",text:d.text,url:d.url})}catch(e){}}else copy(d.text)};
(async()=>{if(!(await loadShort()))load();render()})();
